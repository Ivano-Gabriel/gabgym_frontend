name: GabGym frontend build and tests
on:
  push:
    branches: ['rescue/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: CI=true npm test -- --watch=false --runInBand
      - run: npm run build
        env:
          REACT_APP_API_URL: https://api.example.invalid/api
